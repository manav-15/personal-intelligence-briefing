# Local-only, private instance. No Valkey is needed with the limiter disabled.
use_default_settings:
  engines:
    # Only news engines that return usable publication dates are kept. Google's
    # news engine is CAPTCHA-suspended and Brave's news results arrive without
    # dates, so both are present here only to be disabled explicitly below.
    # General engines are kept alongside them because the news category alone
    # leaves whole topics uncovered — football returns nothing from Reuters.
    keep_only:
      - bing news
      - duckduckgo news
      - reuters
      - duckduckgo
      - mojeek
      - hackernews
      - wikipedia
      # Kept only to disable it: the news engine shares this engine's network
      # configuration, and its definition must remain or startup fails.
      - brave
      - google news
      - brave.news

engines:
  - name: brave
    disabled: true
  - name: google news
    disabled: true
  - name: brave.news
    disabled: true
  # Dated, direct publisher links for AI and developer stories; ships disabled.
  - name: hackernews
    disabled: false

general:
  instance_name: Personal Briefing Search

search:
  formats:
    - html
    - json
  default_lang: en
  autocomplete: ''

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
