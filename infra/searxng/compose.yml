name: personal-briefing-search

services:
  searxng:
    # Official image, pinned to the digest verified on 2026-09-18.
    image: docker.io/searxng/searxng@sha256:ba0a344c566ecc6e4429e81d02d93a01fa05c80e9fb6d08f0a1e57a729aa6d87
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run npm run searxng:start first}
      SEARXNG_BASE_URL: http://localhost:8080/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
